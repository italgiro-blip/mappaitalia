<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoviewer | Italia</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        /* ===== VARIABLES DE COLOR ITALIA ===== */
        :root {
            --it-green: #008C45;      /* Verde bandera italiana */
            --it-green-dark: #005A2B;
            --it-white: #F4F5F0;      /* Blanco bandera italiana */
            --it-red: #CD212A;        /* Rojo bandera italiana */
            --it-red-dark: #8B0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100vh;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            /* ===== FONDO DE TRES COLORES: VERDE, BLANCO, ROJO ===== */
            background: linear-gradient(135deg,
                var(--it-green) 0%,
                var(--it-green) 25%,
                var(--it-white) 45%,
                var(--it-white) 55%,
                var(--it-red) 75%,
                var(--it-red) 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== IMAGEN PNG DE FONDO CON ZOOM + MOVIMIENTO ===== */
        body::after {
            content: '';
            position: absolute;
            inset: -10%;
            background-image: url('./images/img.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            will-change: transform, opacity;
            animation:
                breatheZoom 12s ease-in-out infinite,
                driftMove 18s ease-in-out infinite;
        }

        @keyframes breatheZoom {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.15); }
        }

        @keyframes driftMove {
            0%   { background-position: 45% 50%; }
            25%  { background-position: 55% 45%; }
            50%  { background-position: 50% 55%; }
            75%  { background-position: 45% 50%; }
            100% { background-position: 45% 50%; }
        }

        /* ===== PATRÓN DECORATIVO DE FONDO ===== */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0,140,69,0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.18) 0%, transparent 40%);
            pointer-events: none;
            z-index: 1;
        }

        /* Esferas decorativas flotantes */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 1;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: var(--it-green); top: -80px; left: -80px; opacity: 0.25; }
        .orb-2 { width: 400px; height: 400px; background: var(--it-white); bottom: -120px; right: -100px; animation-delay: 2s; opacity: 0.5; }
        .orb-3 { width: 250px; height: 250px; background: var(--it-red); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; opacity: 0.15; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(30px, -30px) scale(1.1); }
        }

        /* ===== CABECERA CON LOGOS ===== */
        .header-logos {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            z-index: 10;
            animation: fadeDown 1s ease-out;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 150px;
            max-width: 35vw;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25)) brightness(1.05);
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .logo:hover {
            transform: scale(1.08) rotate(-2deg);
            filter: drop-shadow(0 12px 25px rgba(0,140,69,0.5)) brightness(1.1);
        }

        /* ===== CONTENIDO CENTRAL ===== */
        .main-content {
            text-align: center;
            z-index: 5;
            padding: 20px;
            animation: fadeUp 1.2s ease-out 0.3s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            color: var(--it-white);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow:
                0 0 20px rgba(0,0,0,0.4),
                0 4px 15px rgba(0,0,0,0.3);
        }
        .title span {
            background: linear-gradient(90deg, var(--it-green), #7EE0A6, var(--it-red));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            font-size: clamp(0.9rem, 1.8vw, 1.15rem);
            color: var(--it-white);
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 45px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* ===== BOTÓN PRINCIPAL ===== */
        .btn-sig-container {
            position: relative;
            display: inline-block;
            animation: fadeUp 1.2s ease-out 0.6s both;
        }

        .btn-sig {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 22px 55px;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--it-green);
            background: var(--it-white);
            border: 3px solid var(--it-red);
            border-radius: 60px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
            box-shadow:
                0 10px 30px rgba(0,140,69,0.5),
                0 0 0 0 rgba(255,255,255,0.7);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        .btn-sig::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,140,69,0.35), transparent);
            transition: left 0.6s ease;
        }
        .btn-sig:hover::before {
            left: 100%;
        }

        .btn-sig:hover {
            transform: translateY(-4px) scale(1.05);
            background: var(--it-red);
            color: var(--it-white);
            border-color: var(--it-green);
            box-shadow:
                0 15px 40px rgba(205,33,42,0.6),
                0 0 0 4px rgba(0,140,69,0.5);
        }

        .btn-sig svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }
        .btn-sig:hover svg {
            transform: translateX(5px);
        }

        /* ===== BOTÓN GIRATORIO PARA VÍDEO ===== */
        .video-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 5;
        }

        .btn-video-giratorio {
            width: 70px;
            height: 70px;
            background-color: var(--it-red);
            border: 3px solid var(--it-white);
            border-radius: 50%;
            color: var(--it-white);
            font-size: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.6s ease, background-color 0.3s ease, color 0.3s ease;
            outline: none;
        }

        .btn-video-giratorio:hover {
            transform: scale(1.1) rotate(15deg);
            background-color: var(--it-green);
            color: var(--it-white);
            border-color: var(--it-red);
        }

        @keyframes girarInfinito {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .btn-video-giratorio.girando {
            animation: girarInfinito 2.5s linear infinite;
        }

        /* Estilo para el reproductor de vídeo */
        #mi-video {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            border: 3px solid var(--it-white);
            max-width: 90%;
        }

        /* ===== PIE DE PÁGINA ===== */
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: var(--it-white);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
            animation: fadeUp 1.5s ease-out 1s both;
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .footer strong {
            color: var(--it-green);
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header-logos { padding: 0 20px; top: 15px; }
            .logo { width: 100px; }
            .btn-sig { padding: 16px 35px; gap: 8px; }
            .subtitle { letter-spacing: 1.5px; margin-bottom: 30px; }
            .orb-1, .orb-2 { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

    <!-- Esferas decorativas -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Contenido central -->
    <main class="main-content">
        <h1 class="title">Geo<span>viewer</span></h1>
        <p class="subtitle">Scoprire · Esplorare · Imparare</p>

        <div class="btn-sig-container">
            <a href="maps.html"
               class="btn-sig"
               target="_blank"
               rel="noopener noreferrer">
                Apri la mappa
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </a>
        </div>

        <!-- Botón de vídeo y reproductor -->
        <div class="video-container">
            <button id="video-btn" class="btn-video-giratorio" title="Riproduci video">
                <span class="icono">▶</span>
            </button>
            <video id="mi-video" src="./images/mappa.mp4" width="900" style="display:none;"></video>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="footer">
        Progetto <strong>GIS</strong> · Girotto 2026
    </footer>

    <!-- SCRIPT DE CONTROL -->
    <script>
        const boton = document.getElementById('video-btn');
        const video = document.getElementById('mi-video');

        boton.addEventListener('click', () => {
            if (video.style.display === 'none' || video.style.display === '') {
                video.style.display = 'block';
                video.play();
                boton.classList.add('girando');
                boton.querySelector('.icono').textContent = '⏸';
            } else {
                video.pause();
                video.style.display = 'none';
                boton.classList.remove('girando');
                boton.querySelector('.icono').textContent = '▶';
            }
        });
    </script>
</body>
</html>
